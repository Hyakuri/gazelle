<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>多视角注视区域标注</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e8edf6;background:#111824;color-scheme:dark}body{margin:0;padding:18px;max-width:1700px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:22px;margin:0}p{color:#afbdd0}button,select,input,textarea{font:inherit;padding:8px;border:1px solid #405269;border-radius:5px;background:#202d40;color:inherit}button{cursor:pointer}button:hover{background:#34445c}button:disabled{opacity:.5}#image{display:block;width:100%;aspect-ratio:8/3;object-fit:contain;background:#05080c;margin:12px 0;border-radius:7px}#toolbar,#classes,#people{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#timeline{display:flex;height:30px;border:1px solid #8191a4;position:relative;cursor:pointer}#timeline span{height:100%;box-sizing:border-box;border-right:1px solid #222}#cursor{position:absolute;height:38px;top:-4px;width:2px;background:white;pointer-events:none}#scrub{width:100%;padding:0}#status{font-size:14px;color:#a4d6b0}#error{color:#ffb7a9;white-space:pre-wrap}#current{font-variant-numeric:tabular-nums}#reference{max-width:100%;max-height:420px}#definitions{display:flex;gap:15px;flex-wrap:wrap}textarea{width:100%;box-sizing:border-box}summary{cursor:pointer;padding:8px}small{color:#b2c0d2}.label{border-left:7px solid var(--color)}#peopleRanges button{padding:3px 7px;margin:3px}#changes{max-height:110px;overflow:auto;display:flex;gap:5px;flex-wrap:wrap}
</style>
<style>
#frameSurface{position:relative;margin:12px 0}#frameSurface #image{margin:0}#pointOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#pointTools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#pointStatus{color:#f1c40f}#pointNotice{color:#ffd5a0;min-height:1.4em}#timeline span.missingPoint{border-bottom:5px solid #ffb347}#timeline span.hasPoint{box-shadow:inset 0 6px white}
</style>
<header><h1>多视角注视区域标注</h1><span id="status">正在读取数据集…</span></header>
<p>判断依据：眼睛优先，其次头部，最后手部。看自己的手或手中、正被手移动的物体时选“手部/手中物体”，优先于区域。单击全局画面添加注视点；拿不准可跳过。斜线表示尚未看过，橙色底线表示缺注视点。</p>
<div id="error" role="alert"></div>
<div id="toolbar"><label>片段 <select id="segments"></select></label><button id="play">播放（空格）</button><select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option></select><button id="back1">−1 秒</button><button id="back">−0.2 秒</button><button id="forward">+0.2 秒</button><button id="forward1">+1 秒</button><button id="nextUnlabeled">下一个未标注</button></div>
<div id="current"></div><button id="finish" disabled>本段完成</button><div id="frameSurface"><img id="image" alt="前方（左上）、右侧（左下）、全局（右侧）同步画面"><svg id="pointOverlay" viewBox="0 0 1920 720" aria-label="全局注视点"></svg></div>
<div id="pointTools"><button id="deletePoint">删除当前步注视点（X）</button><button id="skipPoint">本片段跳过注视点（S）</button><button id="outOfView">本片段画面外（O）</button><span id="pointStatus"></span></div><div id="pointNotice" role="status"></div>
<div id="timeline" aria-label="标注时间轴"></div><input id="scrub" type="range" min="0" max="299" value="0" aria-label="时间步">
<div id="classes"></div><div id="toolbar"><button id="deleteChange">删除当前变化点（Delete）</button><button id="undo">撤销（Ctrl+Z）</button><small>数字键：从当前步标到下一变化点。左右方向键：移动一步。</small></div>
<div id="changes" aria-label="变化点"></div>
<div id="people"><button id="otherStart">他人入镜开始</button><button id="otherEnd">他人入镜结束（含当前步）</button><button id="otherCancel">取消起点</button><span id="otherState"></span></div><div id="peopleRanges"></div>
<label>片段备注 <textarea id="note" rows="2"></textarea></label>
<details><summary>区域参考与类别定义</summary><img id="reference" alt="区域参考图" hidden><div id="definitions"></div></details>
<script>
'use strict';
const byId=id=>document.getElementById(id);
const clone=value=>JSON.parse(JSON.stringify(value));
function expand(runs,count){const out=Array(count).fill(null);for(const r of runs)for(let i=r.start_step;i<r.end_step_exclusive;i++)out[i]=r.label;return out;}
function compress(values){const runs=[];for(let i=0;i<values.length;i++){if(!runs.length||runs.at(-1).label!==values[i])runs.push({start_step:i,end_step_exclusive:i+1,label:values[i]});else runs.at(-1).end_step_exclusive=i+1;}return runs;}
function setLabel(runs,step,label,count){const values=expand(runs,count);const next=runs.find(r=>r.start_step>step)?.start_step??count;for(let i=step;i<next;i++)values[i]=label;return compress(values);}
function removeChange(runs,step,count){const index=runs.findIndex(r=>r.start_step===step);if(index<0)return clone(runs);const values=expand(runs,count);for(let i=step;i<runs[index].end_step_exclusive;i++)values[i]=index?runs[index-1].label:null;return compress(values);}
function mergePeople(ranges,added){const result=[];for(const row of [...ranges,added].sort((a,b)=>a.start_step-b.start_step)){if(result.length&&row.start_step<=result.at(-1).end_step_exclusive)result.at(-1).end_step_exclusive=Math.max(result.at(-1).end_step_exclusive,row.end_step_exclusive);else result.push({...row});}return result;}
let state,documentData,segmentId,step=0,playing=false,timer=null,otherFrom=null,undoStack=[],saveQueue=Promise.resolve(),pending=0,failed=false,lastTick=performance.now(),lastInteraction=performance.now(),active=0,changing=false;
let displayReady=false,displayKey=null,requestedKey=null;
let viewDirty=false,viewTimer=null,lastSavedAt=-Infinity;
const record=()=>documentData.segments.find(r=>r.segment_id===segmentId);
const meta=()=>state.segments.find(r=>r.segment_id===segmentId);
const classOf=label=>state.classes.classes.find(r=>r.label===label);
const pointRequired=label=>label!==null&&!['away','absent','unknown'].includes(label);
const runAt=(row,index)=>row.labels.find(r=>r.start_step<=index&&index<r.end_step_exclusive);
const pointsIn=(row,run)=>row.points.filter(p=>run.start_step<=p.step&&p.step<run.end_step_exclusive);
const missingPoints=row=>row.labels.filter(r=>pointRequired(r.label)&&!pointsIn(row,r).length&&!row.point_skips.some(s=>s.step===r.start_step));
function overviewCoordinates(event,box){const scale=Math.min(box.width/1920,box.height/720);if(!(scale>0))return null;const x=(event.clientX-box.left-(box.width-1920*scale)/2)/scale,y=(event.clientY-box.top-(box.height-720*scale)/2)/scale;if(x<640||x>1920||y<0||y>720)return null;return {x:(x-640)/1280,y:y/720};}
function cleanPoints(row){const oldPoints=row.points.length,oldSkips=row.point_skips.length,kept=[];for(const p of [...row.points].sort((a,b)=>a.step-b.step)){const run=runAt(row,p.step);if(run&&pointRequired(run.label)&&!kept.some(q=>runAt(row,q.step)===run&&Math.abs(q.step-p.step)<5))kept.push(p);}row.points=kept;row.point_skips=row.point_skips.filter(s=>{const run=row.labels.find(r=>r.start_step===s.step);return run&&pointRequired(run.label)&&(s.reason!=='out_of_view'||['cell_other','hands_object'].includes(run.label));});if(oldPoints!==row.points.length||oldSkips!==row.point_skips.length)byId('pointNotice').textContent=`类别变化后自动清除 ${oldPoints-row.points.length} 个失效注视点、${oldSkips-row.point_skips.length} 个标记；可撤销恢复。`;}
function addPoint(event){const xy=overviewCoordinates(event,byId('image').getBoundingClientRect());if(!xy)return;if(!frameReady())return;const row=record(),run=runAt(row,step);if(!pointRequired(run.label)){byId('pointNotice').textContent='请先选择目标区域、手部/手中物体或工作区内其他位置。';return;}if(pointsIn(row,run).some(p=>p.step!==step&&Math.abs(p.step-step)<5)){byId('pointNotice').textContent='同一片段内注视点须至少相隔 5 步（1 秒）。';return;}pause();change(row=>{row.points=row.points.filter(p=>p.step!==step);row.points.push({step,...xy});row.points.sort((a,b)=>a.step-b.step);});}
function toggleSkip(reason){if(!frameReady())return;const run=runAt(record(),step);if(!pointRequired(run.label)||(reason==='out_of_view'&&!['cell_other','hands_object'].includes(run.label)))return;pause();change(row=>{const old=row.point_skips.find(s=>s.step===run.start_step);row.point_skips=row.point_skips.filter(s=>s.step!==run.start_step);if(old?.reason!==reason)row.point_skips.push({step:run.start_step,reason});row.point_skips.sort((a,b)=>a.step-b.step);});}
function renderPoints(){
 const row=record(),run=runAt(row,step),missing=missingPoints(row),skip=row.point_skips.find(s=>s.step===run.start_step);
 byId('pointStatus').textContent=missing.length?`缺注视点：${missing.length} 个类别片段`:'需要注视点的片段均已处理';
 byId('skipPoint').textContent=skip?.reason==='unsure'?'取消本片段跳过（S）':'本片段跳过注视点（S）';
 byId('outOfView').textContent=skip?.reason==='out_of_view'?'取消本片段画面外（O）':'本片段画面外（O）';
 byId('skipPoint').disabled=!pointRequired(run.label)||failed;
 byId('outOfView').disabled=!['cell_other','hands_object'].includes(run.label)||failed;
 byId('deletePoint').disabled=!row.points.some(p=>p.step===step)||failed;
 const overlay=byId('pointOverlay');overlay.replaceChildren();
 for(const point of pointsIn(row,run)){
  const dot=document.createElementNS(overlay.namespaceURI,'circle');
  for(const [key,value] of Object.entries({cx:640+point.x*1280,cy:point.y*720,r:point.step===step?11:8,fill:'#ffea00',stroke:'#111','stroke-width':2,opacity:point.step===step?1:.25}))dot.setAttribute(key,String(value));
  overlay.append(dot);
 }
 for(let i=0;i<meta().step_count;i++){
  const block=byId('timeline').children[i],hasPoint=row.points.some(p=>p.step===i),lacks=missing.some(r=>r.start_step<=i&&i<r.end_step_exclusive);
  block.className=[hasPoint?'hasPoint':'',lacks?'missingPoint':''].join(' ');
  if(hasPoint)block.title+=' · 注视点';if(lacks)block.title+=' · 缺注视点';
 }
}
function error(message){byId('error').textContent=message;}
function pause(){const wasPlaying=playing;playing=false;clearTimeout(timer);byId('play').textContent='播放（空格）';if(wasPlaying)flushViewed();}
function flushViewed(keepalive=false){if(viewDirty&&!failed&&state)return save(false,keepalive);return saveQueue;}
function queueViewedSave(){viewDirty=true;byId('status').textContent='已看进度等待保存…';clearTimeout(viewTimer);if(pending)return;const delay=Math.max(0,1000-(performance.now()-lastSavedAt));if(delay===0)flushViewed();else viewTimer=setTimeout(()=>flushViewed(),delay);}
function interact(){lastInteraction=performance.now();}
setInterval(()=>{const now=performance.now();if(state&&(playing||now-lastInteraction<15000))active+=(now-lastTick)/1000;lastTick=now;},500);
function save(finish=false,keepalive=false){clearTimeout(viewTimer);viewDirty=false;const row=record();const payload={segment_id:segmentId,labels:clone(row.labels),points:clone(row.points),point_skips:clone(row.point_skips),viewed_ranges:clone(row.viewed_ranges),other_people:clone(row.other_people),note:row.note,finish,active_seconds_delta:active};active=0;pending++;byId('status').textContent='正在保存…';
 const perform=async()=>{if(failed)throw new Error('保存已暂停，请重新加载');payload.revision=documentData.revision;const response=await fetch('/api/save',{method:'POST',keepalive,headers:{'Content-Type':'application/json','X-Editor-Token':state.token},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw new Error(result.error||'保存失败');lastSavedAt=performance.now();documentData.revision=result.revision;const saved=result.segments.find(r=>r.segment_id===payload.segment_id);const current=documentData.segments.find(r=>r.segment_id===payload.segment_id);for(const key of ['started_at','active_seconds','annotator'])current[key]=saved[key];if(['labels','other_people','points','point_skips'].every(key=>JSON.stringify(current[key])===JSON.stringify(saved[key])))current.finished_at=saved.finished_at;pending--;byId('status').textContent=pending?'正在保存…':viewDirty?'已看进度等待保存…':'已保存到本机';render();if(viewDirty&&!pending)queueViewedSave();};
 saveQueue=(keepalive?Promise.all([saveQueue,perform()]):saveQueue.then(perform)).catch(e=>{failed=true;pause();error('保存失败，已停止继续修改：'+e.message+'。请保留页面并检查终端。');render();});return saveQueue;}
function change(fn){if(failed||changing)return;interact();byId('pointNotice').textContent='';undoStack.push({segmentId,row:clone(record()),otherFrom});if(undoStack.length>100)undoStack.shift();const before=JSON.stringify([record().labels,record().other_people,record().points,record().point_skips]);fn(record());cleanPoints(record());if(before!==JSON.stringify([record().labels,record().other_people,record().points,record().point_skips]))record().finished_at=null;save();render();}
function go(value){step=Math.max(0,Math.min(meta().step_count-1,value));interact();render();}
function viewed(row,index){return row.viewed_ranges.some(r=>r.start_step<=index&&index<r.end_step_exclusive);}
function recordDisplayed(key){requestAnimationFrame(()=>requestAnimationFrame(()=>{if(failed||changing||document.visibilityState==='hidden'||requestedKey!==key||displayKey!==key||!displayReady)return;if(!viewed(record(),step)){record().viewed_ranges=mergePeople(record().viewed_ranges,{start_step:step,end_step_exclusive:step+1});queueViewedSave();render();}}));}
function showFrame(){const key=segmentId+'/'+step;if(requestedKey===key)return;requestedKey=key;displayReady=false;const image=byId('image');image.style.opacity='.35';for(const button of byId('classes').children)button.disabled=true;image.onload=()=>{if(requestedKey!==key)return;displayReady=true;displayKey=key;image.style.opacity='1';for(const button of byId('classes').children)button.disabled=false;if(!failed)error('');recordDisplayed(key);};image.onerror=()=>{if(requestedKey!==key)return;pause();displayReady=false;error('当前画面加载失败，已暂停。请检查终端并重新加载页面。');};image.src='/frame/'+encodeURIComponent(segmentId)+'/'+step;}
function hidePage(){flushViewed(true);pause();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')hidePage();else if(displayReady)recordDisplayed(displayKey);});
window.addEventListener('pagehide',hidePage);
function frameReady(){if(displayReady&&displayKey===segmentId+'/'+step)return true;error('请等待当前画面加载完成后再标注。');return false;}
function render(){const row=record(),m=meta(),values=expand(row.labels,m.step_count),label=values[step];showFrame();byId('scrub').max=m.step_count-1;byId('scrub').value=step;
 const seen=row.viewed_ranges.reduce((n,r)=>n+r.end_step_exclusive-r.start_step,0),labelled=values.filter(v=>v!==null).length;
 const wall=new Date((m.start_wall_time+step/m.step_hz)*1000).toISOString().replace('T',' ').slice(0,23);byId('current').textContent=`${m.pilot?'试标 · ':''}${wall}（画面时钟） · ${step+1}/${m.step_count} · ${label===null?'未标注':classOf(label).name_zh} · 已标 ${labelled}/${m.step_count} · 已看 ${seen}/${m.step_count} · ${row.finished_at?'已确认完成':'未确认完成'}`;
 byId('finish').disabled=failed||changing||pending>0||viewDirty||otherFrom!==null||seen!==m.step_count||labelled!==m.step_count||missingPoints(row).length>0||!!row.finished_at;
 const timeline=byId('timeline');timeline.replaceChildren();for(let i=0;i<m.step_count;i++){const block=document.createElement('span');block.style.width=(100/m.step_count)+'%';block.style.backgroundColor=values[i]===null?'#273245':classOf(values[i]).color;const unseen=!viewed(row,i);if(unseen)block.style.backgroundImage='repeating-linear-gradient(45deg,transparent,transparent 3px,#ffffff99 3px,#ffffff99 6px)';block.title=`${i}: ${values[i]??'未标注'}${unseen?' · 未看':''}`;timeline.append(block);}const cursor=document.createElement('i');cursor.id='cursor';cursor.style.left=(step/m.step_count*100)+'%';timeline.append(cursor);
 byId('changes').replaceChildren();for(const r of row.labels){const button=document.createElement('button');button.textContent=`${(r.start_step/m.step_hz).toFixed(1)}s ${r.label===null?'未标注':classOf(r.label).name_zh}`;button.onclick=()=>{pause();go(r.start_step);};byId('changes').append(button);}
 byId('otherState').textContent=otherFrom===null?'':`起点：${otherFrom}（${(otherFrom/m.step_hz).toFixed(1)}秒）`;byId('otherEnd').disabled=otherFrom===null;byId('peopleRanges').replaceChildren();row.other_people.forEach((r,index)=>{const button=document.createElement('button');button.textContent=`他人 ${r.start_step}–${r.end_step_exclusive-1} ×`;button.title='删除此区间';button.onclick=()=>change(row=>row.other_people.splice(index,1));byId('peopleRanges').append(button);});
 byId('deleteChange').disabled=!row.labels.some(r=>r.start_step===step);byId('undo').disabled=!undoStack.length;renderPoints();}
async function switchSegment(identifier,position=0){if(changing||failed)return;if(otherFrom!==null){pause();byId('segments').value=segmentId;error('请先结束或取消他人入镜起点，再切换片段。');return;}changing=true;pause();flushViewed();if(active>0)save();await saveQueue;if(failed){changing=false;return;}segmentId=identifier;step=position;otherFrom=null;undoStack=[];active=0;byId('segments').value=identifier;byId('note').value=record().note;changing=false;render();}
function playTick(){if(!playing)return;if(!displayReady){timer=setTimeout(playTick,25);return;}if(step+1>=meta().step_count){pause();return;}go(step+1);timer=setTimeout(playTick,1000/meta().step_hz/Number(byId('speed').value));}
function togglePlay(){if(playing)pause();else if(!failed){playing=true;byId('play').textContent='暂停（空格）';timer=setTimeout(playTick,1000/meta().step_hz/Number(byId('speed').value));}}
function assign(label){if(frameReady())change(row=>row.labels=setLabel(row.labels,step,label,meta().step_count));}
function undo(){if(!undoStack.length||failed)return;const previous=undoStack.pop();if(previous.segmentId!==segmentId)return;const row=record();const before=JSON.stringify([row.labels,row.other_people,row.points,row.point_skips]);for(const key of ['labels','other_people','note','points','point_skips'])row[key]=clone(previous.row[key]);if(before!==JSON.stringify([row.labels,row.other_people,row.points,row.point_skips]))row.finished_at=null;otherFrom=previous.otherFrom;byId('note').value=row.note;byId('pointNotice').textContent='已撤销，类别、注视点与标记一并恢复。';save();render();}
async function nextUnlabeled(){pause();for(let offset=0;offset<state.segments.length;offset++){const index=(state.segments.findIndex(s=>s.segment_id===segmentId)+offset)%state.segments.length,m=state.segments[index],r=documentData.segments.find(r=>r.segment_id===m.segment_id),values=expand(r.labels,m.step_count);let found=values.findIndex((v,i)=>v===null&&(offset!==0||i>step));if(found>=0){await switchSegment(m.segment_id,found);return;}}const values=expand(record().labels,meta().step_count),found=values.indexOf(null);if(found>=0)go(found);else byId('status').textContent='所有片段均已标注，可运行校验命令';}
byId('play').onclick=togglePlay;byId('back').onclick=()=>{pause();go(step-1);};byId('forward').onclick=()=>{pause();go(step+1);};byId('back1').onclick=()=>{pause();go(step-Math.round(meta().step_hz));};byId('forward1').onclick=()=>{pause();go(step+Math.round(meta().step_hz));};byId('scrub').oninput=e=>{pause();go(Number(e.target.value));};byId('timeline').onclick=e=>{pause();const box=e.currentTarget.getBoundingClientRect();go(Math.floor((e.clientX-box.left)/box.width*meta().step_count));};
byId('segments').onchange=e=>switchSegment(e.target.value);byId('nextUnlabeled').onclick=nextUnlabeled;byId('deleteChange').onclick=()=>change(row=>row.labels=removeChange(row.labels,step,meta().step_count));byId('undo').onclick=undo;
byId('finish').onclick=async()=>{if(byId('finish').disabled)return;pause();await save(true);if(failed)return;const next=documentData.segments.find(r=>!r.finished_at);if(next){const unseen=Array.from({length:next.step_count},(_,i)=>i).find(i=>!viewed(next,i));const missing=expand(next.labels,next.step_count).indexOf(null);await switchSegment(next.segment_id,unseen??(missing<0?0:missing));}else render();};
byId('otherStart').onclick=()=>{if(!frameReady())return;otherFrom=step;interact();render();};byId('otherCancel').onclick=()=>{otherFrom=null;render();};byId('otherEnd').onclick=()=>{if(!frameReady())return;if(otherFrom===null||step<otherFrom){error('结束步不能早于起点');return;}change(row=>{row.other_people=mergePeople(row.other_people,{start_step:otherFrom,end_step_exclusive:step+1});otherFrom=null;});};byId('note').oninput=e=>change(row=>row.note=e.target.value);
byId('frameSurface').onclick=addPoint;byId('deletePoint').onclick=()=>change(row=>row.points=row.points.filter(p=>p.step!==step));byId('skipPoint').onclick=()=>toggleSkip('unsure');byId('outOfView').onclick=()=>toggleSkip('out_of_view');
document.addEventListener('keydown',e=>{if(!state||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}if(e.key===' '){e.preventDefault();togglePlay();}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();pause();go(step+(e.key==='ArrowLeft'?-1:1));}else if(e.key==='Delete'){e.preventDefault();byId('deleteChange').click();}else if(['x','s','o'].includes(e.key.toLowerCase())){e.preventDefault();byId({x:'deletePoint',s:'skipPoint',o:'outOfView'}[e.key.toLowerCase()]).click();}else{const found=state.classes.classes.find(c=>String(c.key)===e.key);if(found){e.preventDefault();assign(found.label);}}});
window.addEventListener('beforeunload',e=>{flushViewed(true);if(pending||failed||otherFrom!==null){e.preventDefault();e.returnValue='';}});
async function start(){const response=await fetch('/api/state');if(!response.ok)throw new Error('无法读取数据集');state=await response.json();documentData=state.document;[segmentId,step]=state.resume;for(const m of state.segments){const option=document.createElement('option');option.value=m.segment_id;option.textContent=(m.pilot?'试标：':'')+m.segment_id;byId('segments').append(option);}byId('segments').value=segmentId;byId('note').value=record().note;
 for(const c of state.classes.classes){const button=document.createElement('button');button.className='label';button.style.setProperty('--color',c.color);button.textContent=`${c.key} ${c.name_zh}`;button.onclick=()=>assign(c.label);byId('classes').append(button);const p=document.createElement('p');p.textContent=`${c.key} ${c.name_zh}：${c.definition||'参见区域参考图与标注指南'}`;byId('definitions').append(p);}
 if(state.has_reference){byId('reference').hidden=false;byId('reference').src='/reference';}byId('status').textContent=state.classes_source==='default-trial'?'默认类别试用数据集 · 修改自动保存':'区域类别数据集 · 修改自动保存';render();}
start().catch(e=>error(e.message));
</script></html>
